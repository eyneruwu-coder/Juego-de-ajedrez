<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajedrez</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e50">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c3e50,#34495e);font-family:system-ui,sans-serif;padding:20px}
h1{color:#fff;margin-bottom:16px;font-size:1.8rem}
.estado{color:#9f9;margin-bottom:16px;font-size:.9rem}
.estado.offline{color:#f99}
.tablero{width:min(90vw,560px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:12px solid #1a1a1a;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.casilla{display:flex;align-items:center;justify-content:center}
.clara{background:#f0d9b5}
.oscura{background:#b58863}
.pieza{width:80%;height:80%;object-fit:contain;transition:transform .2s ease}
.pieza:hover{transform:scale(1.1)}
/* Negras = tal cual */
.pieza.negra{filter:none}
/* Blancas = convertidas a blanco */
.pieza.blanca{filter:invert(1) brightness(1.1)}
</style>
</head>
<body>

<h1>♚ Ajedrez ♔</h1>
<div id="estado" class="estado">✅ Cargando...</div>

<div class="tablero" id="tablero"></div>

<script>
// TUS imágenes — AHORA EN TU PROPIO PROYECTO ✅
const iconos = {
  Torre:    './Torre.png',
  Caballo:  './Caballo.png',
  Peon:     './Peon.png',
  Reina:    './Reina.png',
  Rey:      './Rey.png',
  Alfil:    './Alfil.png'
};

const orden = [
  ['Torre','Caballo','Alfil','Reina','Rey','Alfil','Caballo','Torre'],
  ['Peon','Peon','Peon','Peon','Peon','Peon','Peon','Peon'],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  [null,null,null,null,null,null,null,null],
  ['Peon','Peon','Peon','Peon','Peon','Peon','Peon','Peon'],
  ['Torre','Caballo','Alfil','Reina','Rey','Alfil','Caballo','Torre']
];

const tab = document.getElementById('tablero');
for(let f=0;f<8;f++){
  for(let c=0;c<8;c++){
    const cas = document.createElement('div');
    cas.className = `casilla ${(f+c)%2===0?'clara':'oscura'}`;
    const tipo = orden[f][c];
    if(tipo){
      const img = document.createElement('img');
      img.src = iconos[tipo];
      img.className = `pieza ${f<=1?'negra':'blanca'}`;
      cas.appendChild(img);
    }
    tab.appendChild(cas);
  }
}

// Estado conexión
const estado = document.getElementById('estado');
function actualizar(){
  estado.className = 'estado' + (navigator.onLine?'':' offline');
  estado.textContent = navigator.onLine
    ? '✅ Conectado — ¡Listo para funcionar sin internet!'
    : '🔴 Sin conexión — sigue funcionando desde lo guardado ✅';
}
window.addEventListener('online',actualizar);
window.addEventListener('offline',actualizar);
actualizar();

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
